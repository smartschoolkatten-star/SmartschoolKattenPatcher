name: APK testen

on:
  push:
    branches: [apk-test]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Android-tools installeren
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
      - name: Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Runtime en manifest controleren
        run: python3 tools/test-runtime.py --java-home "$JAVA_HOME" --sdk "$ANDROID_HOME"
      - name: Compose-afbeeldingen controleren
        run: python3 tools/test-compose-bridge.py --java-home "$JAVA_HOME"
      - name: Downloadpagina controleren
        run: node tools/test-downloads.mjs
      - name: Volledige APK bouwen voor tests
        run: python3 tools/build-apk.py --java-home "$JAVA_HOME" --sdk "$ANDROID_HOME" --unsigned
      - uses: actions/upload-artifact@v4
        with:
          name: Smartschool-Katten-test-unsigned
          path: artifacts/apk-release/*
          if-no-files-found: error
          retention-days: 7

# Deze workflow maakt geen releases en publiceert geen APK's.
